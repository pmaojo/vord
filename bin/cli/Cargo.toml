[package]
name = "vord-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "vord — ultraperformant static analysis, quality gates, and a guardrail that judges an AI agent's write before it reaches disk"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# The crate is `vord-cli` (matches every other workspace member's
# `vord-<thing>` naming), but the compiled binary is the bare `vord` every
# doc, hook command (`vord hook claude-code`) and policy template assumes is
# on PATH. Without this, `cargo install --path bin/cli` — the only install
# path for anyone not using a prebuilt release artifact — silently produces
# a binary named `vord-cli`, and every hook wired via `hook install` fails to
# resolve its own command.
[[bin]]
name = "vord"
path = "src/main.rs"

