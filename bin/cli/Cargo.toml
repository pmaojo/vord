[package]
name = "yunq-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "yunq — ultraperformant static analysis, quality gates, and a guardrail that judges an AI agent's write before it reaches disk"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# The crate is `yunq-cli` (matches every other workspace member's
# `yunq-<thing>` naming), but the compiled binary is the bare `yunq` every
# doc, hook command (`yunq hook claude-code`) and policy template assumes is
# on PATH. Without this, `cargo install --path bin/cli` — the only install
# path for anyone not using a prebuilt release artifact — silently produces
# a binary named `yunq-cli`, and every hook wired via `hook install` fails to
# resolve its own command.
[[bin]]
name = "yunq"
path = "src/main.rs"

