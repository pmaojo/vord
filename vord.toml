[project]
key = "vord-core-platform"
name = "vord — The Ultraperformant Code Analysis Platform"
version = "0.11.2"

[analysis]
sources = ["bin", "core", "infra", "parsers", "rulesets"]
exclusions = ["**/fixtures/**", "**/target/**", "benches/**", "**/tests/**", "core/agent/src/runtime_tests.rs"]
profile = "vord way"

[[architecture.forbidden_dependencies]]
from = "core"
to = "infra"

[[architecture.forbidden_dependencies]]
from = "core"
to = "parsers"

[[architecture.forbidden_dependencies]]
from = "core"
to = "rulesets"

[[architecture.forbidden_dependencies]]
from = "core"
to = "bin"

[[architecture.forbidden_dependencies]]
from = "parsers"
to = "infra"

[[architecture.forbidden_dependencies]]
from = "parsers"
to = "bin"

[[architecture.forbidden_dependencies]]
from = "rulesets"
to = "infra"

[[architecture.forbidden_dependencies]]
from = "rulesets"
to = "bin"

[[architecture.forbidden_dependencies]]
from = "infra"
to = "bin"

[gate]
min_health_score = 96

[swarm]
topology = "four-pack"

[[swarm.role]]
name = "architect"
description = "High-level domain architecture and Gherkin acceptance criteria"

[[swarm.role]]
name = "coder"
description = "Implements feature code and unit tests"

[[swarm.role]]
name = "cleaner"
description = "Refactors code smells, prunes test redundancy, keeps CRAP complexity low"

[[swarm.role]]
name = "qa"
description = "Runs coverage, mutation testing, and final quality gate"
