apiVersion: apps/v1
kind: Deployment
metadata:
  name: yunq-server
  labels:
    app.kubernetes.io/name: yunq-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: yunq-server
  template:
    metadata:
      labels:
        app: yunq-server
    spec:
      containers:
        - name: server
          image: yunq/server:v0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: yunq-secrets
                  key: database-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yunq-worker
  labels:
    app.kubernetes.io/name: yunq-worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: yunq-worker
  template:
    metadata:
      labels:
        app: yunq-worker
    spec:
      containers:
        - name: worker
          image: yunq/worker:v0.1.0
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: yunq-secrets
                  key: database-url
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
