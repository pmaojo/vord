[project]
key = "yunq-core-platform"
name = "yunq — The Ultraperformant Code Analysis Platform"
version = "0.2.1"

[analysis]
sources = ["bin", "core", "infra", "parsers", "rulesets"]
exclusions = ["**/fixtures/**", "**/target/**", "benches/**"]
profile = "yunq way"

[[architecture.forbidden_dependencies]]
from = "core"
to = "infra"

[[architecture.forbidden_dependencies]]
from = "core"
to = "parsers"

[[architecture.forbidden_dependencies]]
from = "core"
to = "rulesets"

[[architecture.forbidden_dependencies]]
from = "core"
to = "bin"

[[architecture.forbidden_dependencies]]
from = "parsers"
to = "infra"

[[architecture.forbidden_dependencies]]
from = "parsers"
to = "bin"

[[architecture.forbidden_dependencies]]
from = "rulesets"
to = "infra"

[[architecture.forbidden_dependencies]]
from = "rulesets"
to = "bin"

[[architecture.forbidden_dependencies]]
from = "infra"
to = "bin"
