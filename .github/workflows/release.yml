name: Release Build & Distribution

on:
  push:
    tags:
      - 'v*'

jobs:
  release-binaries:
    name: Build & Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Archive Binaries
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/yunq-cli${{ matrix.binary_suffix }} dist/yunq-${{ matrix.target }}${{ matrix.binary_suffix }}
          cp target/${{ matrix.target }}/release/yunq-server${{ matrix.binary_suffix }} dist/yunq-server-${{ matrix.target }}${{ matrix.binary_suffix }}

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
