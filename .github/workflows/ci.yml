name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --all-targets --workspace
        run: cargo clippy --all-targets --workspace -- -D warnings

  dogfood-gate:
    name: vord scans itself (blocker/critical/parse-failure gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build vord
        run: cargo build -p vord-cli

      - name: Self-scan with the enforced quality gate
        # No coverage/mutation report is fed here, so those two gate
        # conditions read as "no-value" (ignored) rather than failing — see
        # the coverage/mutation jobs below for why those aren't enforced yet.
        # This still gates on the part of the default gate the project does
        # meet today: zero blocker/critical issues, zero parse failures.
        run: ./target/debug/vord scan . --enforce-gate

      - name: Update health score badge
        run: bash scripts/update-health-badge.sh ./target/debug/vord .

      # Only persist the badge on pushes to main, not on every PR branch —
      # the README badge always reflects main's last green build.
      #
      # NOTE: This pushes directly to main. If main is a protected branch
      # (requiring PRs), this step will fail. Either disable branch protection
      # for this single file, or switch to a badge-update PR workflow.
      - name: Commit updated badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vord-health.json
          if git diff --cached --quiet; then
            echo "Health badge unchanged."
          else
            git commit -m "ci: update health score badge to $(jq -r .message .vord-health.json)"
            git push
          fi

  dogfood-coverage:
    name: vord's own test coverage (measured, not yet gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --ignore-filename-regex 'tests?/|fixtures/'

      - name: Build vord
        run: cargo build -p vord-cli

      # Deliberately not `--enforce-gate`: the shipped default gate wants
      # coverage >= 80%, and the real number here is ~72% today. Enforcing
      # that now would fail every PR over something this change didn't
      # regress. This job exists to make the number visible and trending —
      # `--enforce-gate` belongs here once coverage actually clears the bar,
      # not before.
      - name: Report coverage against vord's own gate threshold
        run: ./target/debug/vord scan . --coverage-report lcov.info

  dogfood-mutation:
    name: Mutation-test ${{ matrix.crate }}
    runs-on: ubuntu-latest
    # Widened crate by crate (roadmap item E1), cheapest/purest first, each
    # admitted only once it proves fast enough to stay in CI:
    # vord-agent-policy (the guardrail's own decision logic, the highest-
    # consequence code in the repo) shipped first; vord-profiles (gates,
    # severities, ratings — also small and I/O-free) next; vord-import-graph
    # (cycle detection, cross-file edge extraction, architecture boundaries)
    # next; vord-cpd (rolling-window duplicate detection) is next in that
    # order. Remaining widening (taint → rules-engine) is just more matrix
    # entries.
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: vord-agent-policy
            path: core/agent-policy
          - crate: vord-profiles
            path: core/profiles
          - crate: vord-import-graph
            path: core/import-graph
          - crate: vord-cpd
            path: core/duplication
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants-${{ matrix.crate }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants

      - name: Build vord
        run: cargo build -p vord-cli

      # No --output flag: cargo-mutants' own `-o`/`--output <dir>` creates a
      # `mutants.out` *within* `<dir>` rather than treating `<dir>` as the
      # output itself, so a prior `--output mutants.out` here actually wrote
      # to the nested `mutants.out/mutants.out/outcomes.json` while the next
      # step read the unnested `mutants.out/outcomes.json` and failed with
      # "No such file or directory". Omitting the flag uses cargo-mutants'
      # own default (`mutants.out` in the current directory, i.e. the repo
      # root here), which is exactly the path the next step already expects.
      #
      # cargo-mutants exits 2 (FoundProblems) whenever any mutant survives,
      # and 3 (Timeout) whenever any mutant's test run hit the per-mutant
      # timeout — both are its own pass/fail signal, separate from this
      # workflow's actual gate (the `vord scan --mutation-report
      # --enforce-gate` step below, which checks the score against the
      # quality gate's threshold). A timed-out mutant isn't a tooling
      # failure: it means the mutated code hung (an infinite loop, most
      # often), which is exactly as informative a result as a caught mutant
      # — vord's own mutation_score formula already counts `Timeout` as
      # detected, the same bucket as `Killed` (mirroring Stryker). Letting
      # either code abort the job here would skip the report-conversion and
      # gate steps entirely, so a crate with any surviving-or-timed-out
      # mutant would never reach the check that's supposed to judge it —
      # masked so far only because vord-agent-policy currently has zero of
      # either. Any other exit code (build failure, a baseline that was
      # already failing before any mutation, tool crash) still fails the
      # job immediately, as it should.
      - name: Mutation-test ${{ matrix.crate }}
        run: |
          cargo mutants -p ${{ matrix.crate }} || {
            code=$?
            if [ "$code" -ne 2 ] && [ "$code" -ne 3 ]; then
              exit "$code"
            fi
          }

      # cargo-mutants' own report schema isn't Stryker's; converts each
      # mutant outcome to the Stryker Mutation Testing Elements shape
      # vord's `--mutation-report` already understands (the same importer
      # StrykerJS/Stryker.NET/Infection reports go through), grouped by
      # file. `Unviable` (does not compile) maps to `CompileError`, which
      # vord's mutation_score formula already excludes from both numerator
      # and denominator, same as Stryker's own convention.
      - name: Convert cargo-mutants output to the Stryker report schema
        run: |
          jq '{
            files: (
              [.outcomes[] | select(.scenario != "Baseline") | {
                file: .scenario.Mutant.file,
                status: (
                  if .summary == "CaughtMutant" then "Killed"
                  elif .summary == "MissedMutant" then "Survived"
                  elif .summary == "Unviable" then "CompileError"
                  elif .summary == "Timeout" then "Timeout"
                  else "Ignored" end
                )
              }]
              | group_by(.file)
              | map({key: .[0].file, value: {mutants: map({status: .status})}})
              | from_entries
            )
          }' mutants.out/outcomes.json > mutation-report.json

      # Enforced: every crate in the matrix clears the default gate's 60%
      # bar comfortably (vord-agent-policy ~95%, vord-profiles ~72%,
      # vord-import-graph ~92%, vord-cpd ~84% as of this crate's
      # introduction), so unlike the workspace-wide coverage job above,
      # there's no reason to hold this one back from actually gating.
      - name: Gate on ${{ matrix.crate }}'s mutation score
        run: ./target/debug/vord scan ${{ matrix.path }} --mutation-report mutation-report.json --enforce-gate

  benchmark-gate:
    name: Benchmark regression gate
    # Only meaningful with a merge base to diff against; a direct push to
    # main has none.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Benchmark PR head
        run: cargo run --release -p vord-benchmarks --bin perf_report -- --output /tmp/pr-perf.json

      # The merge base predates whatever PR first introduced the
      # perf_report binary itself (a one-time bootstrap gap — every PR
      # after that one has it on `main` already), so this can't assume the
      # binary exists there. Skips the gate gracefully instead of failing
      # the job when it doesn't.
      - name: Benchmark merge base
        id: base_bench
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          if cargo run --release -p vord-benchmarks --bin perf_report -- --output /tmp/base-perf.json; then
            echo "has_base=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_base=false" >> "$GITHUB_OUTPUT"
            echo "::warning::perf_report binary not buildable at the merge base (predates its introduction) — skipping the regression gate for this PR."
          fi
          git checkout ${{ github.event.pull_request.head.sha }}

      # Diffs PR head against its own merge base on the same runner, rather
      # than a committed baseline number — avoids false positives/negatives
      # from comparing across different hardware generations over time.
      # Reports (and, via the exit code, gates on) throughput; peak-RSS and
      # p99 file-scan latency are printed for visibility but not yet gated
      # on — no established target for either.
      - name: Compare and gate on >10% throughput regression
        if: steps.base_bench.outputs.has_base == 'true'
        run: cargo run --release -p vord-benchmarks --bin perf_report -- --compare /tmp/base-perf.json /tmp/pr-perf.json
