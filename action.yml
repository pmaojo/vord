name: 'vord Static Analysis'
description: 'Fast, language-agnostic static analysis with a Clean as You Code quality model and an agent guardrail'
author: 'pmaojo'
branding:
  icon: 'shield'
  color: 'purple'

# Downloads the released binary rather than building from source. The previous
# version ran `cargo run --bin vord`, which could never work: a composite
# action executes inside the *consumer's* checkout, where vord's sources — and
# usually Cargo itself — do not exist, and the bin target is `vord-cli` anyway.

inputs:
  version:
    description: 'vord release tag to use, or "latest"'
    required: false
    default: 'latest'
  path:
    description: 'Directory to analyze'
    required: false
    default: '.'
  args:
    description: 'Extra arguments appended to `vord scan` (e.g. --monorepo --coverage lcov.info)'
    required: false
    default: ''
  format:
    description: 'Output format: text, json or sarif'
    required: false
    default: 'text'
  enforce-gate:
    description: 'Fail the job when the quality gate fails'
    required: false
    default: 'true'
  github-token:
    description: 'Token used to post the commit status and PR review'
    required: false
    default: '${{ github.token }}'
  commit-sha:
    description: 'Commit SHA to attach the analysis status to (auto-detected when empty)'
    required: false
    default: ''
  repository:
    description: 'owner/repo to decorate (auto-detected when empty)'
    required: false
    default: ''

outputs:
  exit-code:
    description: 'Exit status of the scan (0 = gate passed)'
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Install vord
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64)  target="x86_64-unknown-linux-musl" ;;
          Linux/aarch64) target="aarch64-unknown-linux-musl" ;;
          Darwin/x86_64) target="x86_64-apple-darwin" ;;
          Darwin/arm64)  target="aarch64-apple-darwin" ;;
          *) echo "::error::unsupported runner: $(uname -s)/$(uname -m)"; exit 1 ;;
        esac
        if [ "${{ inputs.version }}" = "latest" ]; then
          base="https://github.com/pmaojo/vord/releases/latest/download"
        else
          base="https://github.com/pmaojo/vord/releases/download/${{ inputs.version }}"
        fi
        dir="${RUNNER_TEMP}/vord-bin"
        mkdir -p "$dir"
        curl -fsSL "$base/vord-${target}" -o "$dir/vord"
        if curl -fsSL "$base/vord-${target}.sha256" -o "$dir/sum"; then
          echo "$(awk '{print $1}' "$dir/sum")  $dir/vord" | sha256sum -c - \
            || { echo "::error::vord checksum mismatch — refusing to run"; exit 1; }
        else
          echo "::warning::no published checksum for vord-${target} — not verified"
        fi
        chmod +x "$dir/vord"
        echo "$dir" >> "$GITHUB_PATH"

    - name: Run vord scan
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -uo pipefail
        args=(scan "${{ inputs.path }}" --format "${{ inputs.format }}")
        [ "${{ inputs.enforce-gate }}" = "true" ] && args+=(--enforce-gate)
        [ -n "${{ inputs.commit-sha }}" ] && args+=(--commit-sha "${{ inputs.commit-sha }}")
        [ -n "${{ inputs.repository }}" ] && args+=(--github-repo "${{ inputs.repository }}")
        # Branch, PR number, commit and repo are auto-detected from the
        # Actions environment when not passed explicitly (see ci_detect.rs).
        read -r -a extra <<< "${{ inputs.args }}"
        [ ${#extra[@]} -gt 0 ] && args+=("${extra[@]}")

        vord "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit $code
