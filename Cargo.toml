[workspace]
resolver = "3"
members = ["core/*", "infra/*", "parsers/*", "rulesets/*", "bin/*", "benches"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/pmaojo/yunq"
homepage = "https://github.com/pmaojo/yunq"
readme = "README.md"
keywords = ["static-analysis", "sast", "code-quality", "security", "linter"]
categories = ["development-tools", "development-tools::testing"]

[workspace.dependencies]
# Internal crates
yunq-ast = { path = "core/ast", version = "0.1.1" }
yunq-profiles = { path = "core/profiles", version = "0.1.1" }
yunq-rules-engine = { path = "core/rules-engine", version = "0.1.1" }
yunq-taint = { path = "core/taint", version = "0.1.1" }
yunq-symbols = { path = "core/symbols", version = "0.1.1" }
yunq-import-graph = { path = "core/import-graph", version = "0.1.1" }
yunq-agent-policy = { path = "core/agent-policy", version = "0.1.1" }
yunq-parser-typescript = { path = "parsers/treesitter-typescript", version = "0.1.1" }
yunq-parser-rust = { path = "parsers/treesitter-rust", version = "0.1.1" }
yunq-parser-python = { path = "parsers/treesitter-python", version = "0.1.1" }
yunq-parser-go = { path = "parsers/treesitter-go", version = "0.1.1" }
yunq-parser-java = { path = "parsers/treesitter-java", version = "0.1.1" }
yunq-parser-c = { path = "parsers/treesitter-c", version = "0.1.1" }
yunq-parser-cpp = { path = "parsers/treesitter-cpp", version = "0.1.1" }
yunq-parser-php = { path = "parsers/treesitter-php", version = "0.1.1" }
yunq-parser-dockerfile = { path = "parsers/treesitter-dockerfile", version = "0.1.1" }
yunq-parser-csharp = { path = "parsers/treesitter-csharp", version = "0.1.1" }
yunq-parser-ruby = { path = "parsers/treesitter-ruby", version = "0.1.1" }
yunq-parser-kotlin = { path = "parsers/treesitter-kotlin", version = "0.1.1" }
yunq-parser-swift = { path = "parsers/treesitter-swift", version = "0.1.1" }
yunq-parser-scala = { path = "parsers/treesitter-scala", version = "0.1.1" }
yunq-parser-html = { path = "parsers/treesitter-html", version = "0.1.1" }
yunq-parser-css = { path = "parsers/treesitter-css", version = "0.1.1" }
yunq-parser-xml = { path = "parsers/treesitter-xml", version = "0.1.1" }
yunq-parser-json = { path = "parsers/treesitter-json", version = "0.1.1" }
yunq-parser-yaml = { path = "parsers/treesitter-yaml", version = "0.1.1" }
yunq-parser-hcl = { path = "parsers/treesitter-hcl", version = "0.1.1" }
yunq-parser-bash = { path = "parsers/treesitter-bash", version = "0.1.1" }
yunq-parser-groovy = { path = "parsers/treesitter-groovy", version = "0.1.1" }
yunq-parser-lua = { path = "parsers/treesitter-lua", version = "0.1.1" }
yunq-parser-elixir = { path = "parsers/treesitter-elixir", version = "0.1.1" }
yunq-treesitter-tokens = { path = "parsers/treesitter-tokens", version = "0.1.1" }
yunq-cpd = { path = "core/duplication", version = "0.1.1" }
yunq-crap = { path = "core/crap", version = "0.1.1" }
yunq-rules-owasp = { path = "rulesets/owasp", version = "0.1.1" }
yunq-rules-smells = { path = "rulesets/code-smells", version = "0.1.1" }
yunq-rules-iac = { path = "rulesets/iac", version = "0.1.1" }
yunq-rules-a11y = { path = "rulesets/a11y", version = "0.1.1" }
yunq-rules-react = { path = "rulesets/react", version = "0.1.1" }
yunq-rules-secrets = { path = "rulesets/secrets", version = "0.1.1" }
yunq-rules-rust = { path = "rulesets/rust", version = "0.1.1" }
yunq-rules-python = { path = "rulesets/python", version = "0.1.1" }
yunq-rules-architecture = { path = "rulesets/architecture", version = "0.1.1" }
yunq-rules-reactive = { path = "rulesets/reactive", version = "0.1.1" }
yunq-rules-typescript = { path = "rulesets/typescript", version = "0.1.1" }
yunq-rules-php = { path = "rulesets/php", version = "0.1.1" }
yunq-rules-go = { path = "rulesets/go", version = "0.1.1" }
yunq-rules-ai-agent = { path = "rulesets/ai-agent", version = "0.1.1" }
yunq-infra-memory = { path = "infra/memory", version = "0.1.1" }
yunq-cli = { path = "bin/cli", version = "0.1.1" }
yunq-infra-fs = { path = "infra/fs", version = "0.1.1" }
yunq-infra-github = { path = "infra/github", version = "0.1.1" }
yunq-infra-gitlab = { path = "infra/gitlab", version = "0.1.1" }
yunq-infra-bitbucket = { path = "infra/bitbucket", version = "0.1.1" }
yunq-infra-azure = { path = "infra/azure", version = "0.1.1" }
yunq-infra-pdf = { path = "infra/pdf", version = "0.1.1" }
yunq-remediation = { path = "core/remediation", version = "0.1.1" }
yunq-infra-llm = { path = "infra/llm", version = "0.1.1" }

# External
thiserror = "2"
chrono = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
quick-xml = "0.36"
axum = "0.8"
tree-sitter = "0.26.11"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
tower-lsp = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
url = "2"
hmac = "0.12"
sha2 = "0.10"
flate2 = "1"
base64 = "0.22"
aes-gcm = "0.10"
dialoguer = "0.12"
