[workspace]
resolver = "3"
members = ["core/*", "infra/*", "parsers/*", "rulesets/*", "bin/*", "benches"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
yunq-ast = { path = "core/ast" }
yunq-profiles = { path = "core/profiles" }
yunq-rules-engine = { path = "core/rules-engine" }
yunq-taint = { path = "core/taint" }
yunq-symbols = { path = "core/symbols" }
yunq-import-graph = { path = "core/import-graph" }
yunq-agent-policy = { path = "core/agent-policy" }
yunq-parser-typescript = { path = "parsers/treesitter-typescript" }
yunq-parser-rust = { path = "parsers/treesitter-rust" }
yunq-parser-python = { path = "parsers/treesitter-python" }
yunq-parser-go = { path = "parsers/treesitter-go" }
yunq-parser-java = { path = "parsers/treesitter-java" }
yunq-parser-c = { path = "parsers/treesitter-c" }
yunq-parser-cpp = { path = "parsers/treesitter-cpp" }
yunq-parser-php = { path = "parsers/treesitter-php" }
yunq-parser-dockerfile = { path = "parsers/treesitter-dockerfile" }
yunq-parser-csharp = { path = "parsers/treesitter-csharp" }
yunq-parser-ruby = { path = "parsers/treesitter-ruby" }
yunq-parser-kotlin = { path = "parsers/treesitter-kotlin" }
yunq-parser-swift = { path = "parsers/treesitter-swift" }
yunq-parser-scala = { path = "parsers/treesitter-scala" }
yunq-parser-html = { path = "parsers/treesitter-html" }
yunq-parser-css = { path = "parsers/treesitter-css" }
yunq-parser-xml = { path = "parsers/treesitter-xml" }
yunq-parser-json = { path = "parsers/treesitter-json" }
yunq-parser-yaml = { path = "parsers/treesitter-yaml" }
yunq-parser-hcl = { path = "parsers/treesitter-hcl" }
yunq-parser-bash = { path = "parsers/treesitter-bash" }
yunq-parser-groovy = { path = "parsers/treesitter-groovy" }
yunq-parser-lua = { path = "parsers/treesitter-lua" }
yunq-parser-elixir = { path = "parsers/treesitter-elixir" }
yunq-treesitter-tokens = { path = "parsers/treesitter-tokens" }
yunq-cpd = { path = "core/duplication" }
yunq-rules-owasp = { path = "rulesets/owasp" }
yunq-rules-smells = { path = "rulesets/code-smells" }
yunq-rules-iac = { path = "rulesets/iac" }
yunq-rules-a11y = { path = "rulesets/a11y" }
yunq-rules-react = { path = "rulesets/react" }
yunq-rules-secrets = { path = "rulesets/secrets" }
yunq-rules-rust = { path = "rulesets/rust" }
yunq-rules-python = { path = "rulesets/python" }
yunq-rules-architecture = { path = "rulesets/architecture" }
yunq-rules-reactive = { path = "rulesets/reactive" }
yunq-rules-typescript = { path = "rulesets/typescript" }
yunq-rules-php = { path = "rulesets/php" }
yunq-rules-ai-agent = { path = "rulesets/ai-agent" }
yunq-infra-memory = { path = "infra/memory" }
yunq-cli = { path = "bin/cli" }
yunq-infra-fs = { path = "infra/fs" }
yunq-infra-postgres = { path = "infra/postgres" }
yunq-infra-github = { path = "infra/github" }
yunq-infra-gitlab = { path = "infra/gitlab" }
yunq-infra-bitbucket = { path = "infra/bitbucket" }
yunq-infra-azure = { path = "infra/azure" }
yunq-infra-pdf = { path = "infra/pdf" }
yunq-remediation = { path = "core/remediation" }
yunq-infra-llm = { path = "infra/llm" }

# External
thiserror = "2"
chrono = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
quick-xml = "0.36"
axum = "0.8"
tree-sitter = "0.26.11"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
tower-lsp = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
url = "2"
hmac = "0.12"
sha2 = "0.10"
flate2 = "1"
base64 = "0.22"
aes-gcm = "0.10"
dialoguer = "0.12"
